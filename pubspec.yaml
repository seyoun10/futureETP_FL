name: futureetp
description: "futureETP Flutter client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  clock: ^1.1.3
  cupertino_ui: ^1.1.7
  dio: ^5.11.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.1.0
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_schema: ^5.2.2
  json_serializable: ^6.15.2
  path: ^1.9.1
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

# 앱 아이콘은 RN(../futureETP/apps/mobile/assets/images)과 같은 이미지. 바꾸면 dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: assets/icon/android-icon-background.png
  adaptive_icon_foreground: assets/icon/android-icon-foreground.png
  adaptive_icon_monochrome: assets/icon/android-icon-monochrome.png

# 실행 화면은 RN expo-splash-screen과 같게 검정 배경 + splash-icon 76pt 너비.
# 이미지는 RN splash-icon.png(228px = 3x)를 4x(304px)로 키운 것, Android 12+는 1152px 캔버스 가운데에 둔 것.
# 바꾸면 dart run flutter_native_splash:create
flutter_native_splash:
  color: "#000000"
  image: assets/splash/splash-icon.png
  android_12:
    color: "#000000"
    image: assets/splash/splash-icon-android12.png
  web: false
