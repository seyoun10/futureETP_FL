name: futureetp
description: "futureETP Flutter client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  clock: ^1.1.3
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.1.0
  mobile_scanner: ^7.5.0
  shared_preferences: ^2.5.6

dev_dependencies:
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_schema: ^5.2.2
  json_serializable: ^6.15.2
  path: ^1.9.1
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

# 앱 아이콘은 RN(../futureETP/apps/mobile/assets/images)과 같은 이미지. 바꾸면 dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: assets/icon/android-icon-background.png
  adaptive_icon_foreground: assets/icon/android-icon-foreground.png
  adaptive_icon_monochrome: assets/icon/android-icon-monochrome.png
