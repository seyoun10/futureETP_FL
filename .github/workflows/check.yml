# 커밋 전 검사(./tool/check.sh)를 push·PR마다 다시 돌린다. 앱 빌드는 하지 않는다(FL-014).
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # 로컬 SDK(docs/tech-stack.md)와 같은 버전. 로컬을 올리면 여기도 올린다
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter --disable-analytics
      - run: flutter pub get
      # ARB로 l10n 코드를 다시 만들어 커밋된 생성 파일과 다르면 멈춘다.
      # pub get(generate: true)의 자동 생성에 기대지 않고 gen-l10n을 직접 돌린다
      - name: l10n generated code is up to date
        run: |
          flutter gen-l10n
          changes=$(git status --porcelain -- lib/l10n)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- lib/l10n
            echo "::error::lib/l10n 생성 코드가 ARB와 다릅니다. flutter gen-l10n 결과를 커밋하세요"
            exit 1
          fi
      - run: ./tool/check.sh
